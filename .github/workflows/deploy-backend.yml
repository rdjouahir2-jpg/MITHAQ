name: Deploy MITHAQ backend (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to apply migrations and deploy backend to the MITHAQ test project"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mithaq-test-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test -n "$SUPABASE_DB_URL" || { echo "::error::Missing SUPABASE_DB_URL repository secret (IPv4 session pooler connection string)"; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check database connection string format
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          from urllib.parse import urlsplit
          value = os.environ.get("SUPABASE_DB_URL", "")
          try:
              parsed = urlsplit(value)
              valid = (
                  parsed.scheme == "postgresql"
                  and parsed.hostname is not None
                  and parsed.hostname.endswith("pooler.supabase.com")
                  and parsed.username is not None
                  and parsed.password is not None
                  and parsed.password != "[YOUR-PASSWORD]"
                  and parsed.port == 5432
                  and parsed.path == "/postgres"
              )
          except Exception:
              valid = False
          if not valid:
              print("::error::SUPABASE_DB_URL is not a valid Session Pooler URL. Recreate the secret from Supabase > Connect > Session pooler, replace [YOUR-PASSWORD], and URL-encode special characters in the database password. Do not share the URL in chat.")
              sys.exit(1)
          print("Database URL format looks valid; its value is hidden.")
          PY

      - name: Apply ordered database migrations over IPv4 session pooler
        run: supabase db push --remote="$SUPABASE_DB_URL" --yes

      - name: Set server-only function configuration
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.MITHAQ_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "::error::Missing MITHAQ_CRON_SECRET repository secret"; exit 1; }
          printf 'ALLOWED_ORIGIN=%s\nROUTING_BASE_URL=%s\nCRON_SECRET=%s\n' \
            'https://rdjouahir2-jpg.github.io' \
            'https://router.project-osrm.org' \
            "$CRON_SECRET" > "$RUNNER_TEMP/mithaq-function-secrets.env"
          supabase secrets set --project-ref bzoubheoooszhzajzsur --env-file "$RUNNER_TEMP/mithaq-function-secrets.env" --yes
          rm -f "$RUNNER_TEMP/mithaq-function-secrets.env"

      - name: Deploy fare quote function
        run: supabase functions deploy create-fare-quote --project-ref bzoubheoooszhzajzsur --yes

      - name: Deploy dispatch maintenance function
        run: supabase functions deploy dispatch-maintenance --project-ref bzoubheoooszhzajzsur --yes --no-verify-jwt

      - name: Deploy authenticated native driver-location ingestion
        run: supabase functions deploy driver-location --project-ref bzoubheoooszhzajzsur --yes --no-verify-jwt
