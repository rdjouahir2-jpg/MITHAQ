name: MITHAQ database tests

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/db-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/db-tests.yml"

concurrency:
  group: mithaq-db-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack and apply migrations
        run: |
          if ! supabase start > /tmp/mithaq-supabase-start.log 2>&1; then
            sed -E 's/sb_secret_[A-Za-z0-9_-]+/[REDACTED]/g; s/sb_publishable_[A-Za-z0-9_-]+/[REDACTED]/g' /tmp/mithaq-supabase-start.log | tail -n 100
            exit 1
          fi
          echo "Local Supabase stack started. Startup keys are not printed to CI logs."
      - name: Run pgTAP database tests
        run: supabase test db
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
