name: MITHAQ database tests

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/db-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/db-tests.yml"

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack and apply migrations
        run: supabase start
      - name: Run pgTAP database tests
        run: supabase test db
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
