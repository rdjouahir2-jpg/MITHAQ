name: MITHAQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mithaq-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check --config supabase/functions/deno.json supabase/functions/create-fare-quote/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/dispatch-maintenance/index.ts
      - name: Test ride-domain invariants
        run: deno test src/domain/ride.test.ts
