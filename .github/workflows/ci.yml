name: MITHAQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve and lock npm dependencies
        run: npm install --package-lock-only
      - name: Install exactly the lockfile versions
        run: npm ci
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check --config supabase/functions/deno.json supabase/functions/create-fare-quote/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/dispatch-maintenance/index.ts
      - name: Commit generated dependency lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock npm dependencies [skip ci]"
            git push
          fi
