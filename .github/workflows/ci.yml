name: MITHAQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mithaq-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check --config supabase/functions/deno.json supabase/functions/create-fare-quote/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/dispatch-maintenance/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/driver-location/index.ts
      - name: Test ride and fare-negotiation domain invariants
        run: deno test tests/ride.test.ts tests/negotiation.test.ts tests/driver-location.test.ts

  android-apk:
    if: ${{ github.event_name == 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build native web assets
        run: npm run build:android
      - name: Generate Android project and sync native plugins
        run: |
          npx cap add android
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Build installable debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mithaq-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
